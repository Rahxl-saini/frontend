<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Blog Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Dynamic Blog</h1>
        <p>Read from our blog.</p>
    </header>

    <main class="container">
        <section class="controls">
            <input
                type="search"
                id="search"
                placeholder="Search blog posts by title..."
            >
<button id="reloadButton" type="button">
    Reload Posts
</button>
</section>

<p
    id="statusMessage"
    role="status"
    aria-live="polite"
>
    Loading posts...
</p>

<section
    id="postsContainer"
    class="posts-grid"
></section>
</main>

<script src="script.js" defer></script>
</body>
</html>
